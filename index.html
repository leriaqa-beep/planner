<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ежедневник Лер</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky week strip on top, week time budget, then one day column — time rail, task cards; editors open in a bottom sheet */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1B2130; --muted:#646C80; --line:#DCDFE7;
  --accent:#2F49C9; --accent-soft:#E6EAFB; --done:#2E8B57; --warn:#C2410C; --warn-soft:#FDEDE4;
  --wait:#8A6D1E; --wait-soft:#F7F0DC; --star:#D49B00;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --p-leads:#2F49C9; --p-course:#7C3AED; --p-kp:#0E7490; --p-zalkar:#B45309; --p-jbn:#BE185D;
  --p-artsky:#4D7C0F; --p-add:#0369A1; --p-meder:#6D28D9; --p-ads:#C2410C; --p-other:#64748B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B1F29; --ink:#E7EAF2; --muted:#9AA1B4; --line:#2C3242;
  --accent:#8EA2FF; --accent-soft:#232B4A; --done:#5CC28C; --warn:#FB923C; --warn-soft:#3A2418;
  --wait:#E6C66A; --wait-soft:#33301E; --star:#F5C542;
  --p-leads:#8EA2FF; --p-course:#B794F6; --p-kp:#5EC4D8; --p-zalkar:#F0B35B; --p-jbn:#F17DB4;
  --p-artsky:#A3D45C; --p-add:#6CB8F0; --p-meder:#C4A5FF; --p-ads:#FB923C; --p-other:#A3ADC2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B1F29; --ink:#E7EAF2; --muted:#9AA1B4; --line:#2C3242;
  --accent:#8EA2FF; --accent-soft:#232B4A; --done:#5CC28C; --warn:#FB923C; --warn-soft:#3A2418;
  --wait:#E6C66A; --wait-soft:#33301E; --star:#F5C542;
  --p-leads:#8EA2FF; --p-course:#B794F6; --p-kp:#5EC4D8; --p-zalkar:#F0B35B; --p-jbn:#F17DB4;
  --p-artsky:#A3D45C; --p-add:#6CB8F0; --p-meder:#C4A5FF; --p-ads:#FB923C; --p-other:#A3ADC2;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 12px;display:grid;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav span{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:118px;text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.icon{padding:6px 10px;font-family:var(--f-mono)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.check:focus-visible,.tools button:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tab{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 4px 7px;display:grid;gap:2px;justify-items:center;min-width:0}
.tab .dn{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tab .dd{font-family:var(--f-mono);font-weight:600;font-size:15px}
.tab .bar{width:70%;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.tab .bar i{display:block;height:100%;background:var(--done)}
.tab.today .dd{color:var(--accent)}
.tab.active{background:var(--accent-soft);border-color:var(--accent)}
.tab.weekend{opacity:.6}
.tab .warnDot{width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* week budget */
.week{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{display:grid;gap:1px;min-width:0}
.kpi small{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi b.neg{color:var(--warn)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%;background:var(--pc)}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.plegend span{white-space:nowrap}
.plegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:5px;vertical-align:1px}
.plegend b{font-family:var(--f-mono);font-weight:600;color:var(--ink);margin-left:3px;font-variant-numeric:tabular-nums}
.week details{font-size:13.5px}
.week summary{cursor:pointer;color:var(--muted);font-weight:500}
.week ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}

.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 6px}
.dayhead h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0;text-wrap:balance}
.hours{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:0 0 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{border-radius:10px;padding:10px 12px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.banner.over{background:var(--warn-soft);border:1px solid var(--warn)}
.banner.waiting{background:var(--wait-soft);border:1px solid var(--wait);display:grid;gap:6px}
.banner.waiting ul{margin:0;padding-left:18px;display:grid;gap:2px}
.banner.waiting .d{font-family:var(--f-mono);font-size:12.5px;color:var(--wait)}
.focus{background:var(--surface);border:1px solid var(--star);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.focus h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--star);font-weight:700}
.focus ol{margin:0;padding-left:20px;display:grid;gap:3px;font-weight:600}
.focus li.done{text-decoration:line-through;color:var(--muted);font-weight:500}
.focus p{margin:0;font-size:13.5px;color:var(--muted)}
.list{display:grid;gap:8px}
.task{display:grid;grid-template-columns:62px 28px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 0;position:relative}
.task::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--pc,var(--p-other))}
.task.star{border-color:var(--star)}
.task.conflict{border-color:var(--warn)}
.time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:3px;font-variant-numeric:tabular-nums;line-height:1.3}
.time b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.check{width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--done);border-color:var(--done)}
.task.done .check svg{opacity:1}
.body{min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.title .s{color:var(--star);margin-right:4px}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.note{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--pc);border:1px solid var(--pc);border-radius:999px;padding:0 8px}
.flag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:0 8px}
.flag.w{background:var(--wait-soft);color:var(--wait)}
.flag.x{background:var(--warn-soft);color:var(--warn)}
.flag.m{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.tools button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 7px;font-size:13px;white-space:nowrap}
.tools button:hover{background:var(--accent-soft);color:var(--ink)}
.tools button.on{color:var(--star)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.status{font-size:13px;color:var(--muted);margin-top:18px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:20}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer form{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 20px;display:grid;gap:12px}
.drawer h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0}
.drawer .sub{margin:-6px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.inline{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px}
label.inline input{width:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13.5px}
.pill.sel{background:var(--accent-soft);border-color:var(--accent)}
.formbtns{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.danger{color:var(--warn)!important;border-color:var(--warn)!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.viewsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewsw button{border:0;background:transparent;padding:6px 12px;font-weight:500;font-size:14px}
.viewsw button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
body.wide .wrap{max-width:1320px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;min-width:0}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;scroll-snap-align:start}
.col.pool{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.col.today{border-color:var(--accent)}
.col.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
.colhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.colhead .cn{border:0;background:none;padding:0;text-align:left;font-family:var(--f-display);font-weight:500;font-size:14px;display:flex;gap:6px;align-items:center}
.col.today .colhead .cn{color:var(--accent)}
.colhead .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.colhead .meta.neg{color:var(--warn)}
.cards{padding:8px;display:grid;gap:6px;align-content:start;min-height:140px;flex:1}
.cards .hint{font-size:12.5px;color:var(--muted);padding:6px 4px}
.card{border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:8px;padding:7px 8px;background:var(--surface);display:grid;grid-template-columns:20px minmax(0,1fr);gap:3px 8px;cursor:grab}
.col.pool .card{background:var(--surface)}
.card.star{border-color:var(--star);border-left-color:var(--pc)}
.card.conflict{border-color:var(--warn);border-left-color:var(--pc)}
.card.dragging{opacity:.4}
.card .check{width:18px;height:18px;border-width:2px;border-radius:5px;margin-top:2px}
.card .check svg{width:11px;height:11px}
.card.done .check{background:var(--done);border-color:var(--done)}
.card.done .check svg{opacity:1}
.card .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .cttl{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.card.done .cttl{text-decoration:line-through;color:var(--muted)}
.card .cttl .s{color:var(--star);margin-right:3px}
.card .cflags{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}
.card .flag{font-size:10.5px;padding:0 6px}
.card .planbtn{grid-column:2;justify-self:start;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600;margin-top:2px}
.coladd{border:0;border-top:1px solid var(--line);background:transparent;color:var(--muted);padding:8px;font-size:13px;border-radius:0 0 12px 12px}
.coladd:hover{color:var(--accent);background:var(--accent-soft)}
.cards .card:focus-visible,.cttl:focus-visible,.cn:focus-visible,.planbtn:focus-visible,.coladd:focus-visible,.viewsw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.backup{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
.backup h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0}
.backup p{margin:0;font-size:13.5px;color:var(--muted)}
.backup p.warn{color:var(--warn)}
.bkconfirm{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:10px;font-size:14px}
@media (max-width:560px){
  .days{gap:4px}.tab .dn{font-size:10.5px;letter-spacing:.02em}.tab .dd{font-size:13px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .task{grid-template-columns:50px 26px minmax(0,1fr);}
  .tools{grid-column:2/-1;justify-content:flex-start}
  .row{grid-template-columns:1fr 1fr}.row label:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.task{transition:border-color .15s}.drawer{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <h1>Ежедневник</h1>
    <div class="weeknav">
      <button class="btn icon" id="prevW" aria-label="Предыдущая неделя">←</button>
      <span id="weekLabel"></span>
      <button class="btn icon" id="nextW" aria-label="Следующая неделя">→</button>
      <button class="btn" id="todayBtn">Сегодня</button>
      <div class="viewsw" role="group" aria-label="Вид"><button id="vDay" aria-pressed="true">День</button><button id="vWeek" aria-pressed="false">Неделя</button></div>
    </div>
  </div>
  <nav class="days" id="days" aria-label="Дни недели"></nav>
</div></header>

<main class="wrap">
  <section class="week" aria-label="Время недели">
    <div class="kpis">
      <div class="kpi"><small>Доступно</small><b id="kAvail"></b></div>
      <div class="kpi"><small>Запланировано</small><b id="kPlan"></b></div>
      <div class="kpi"><small>Свободно</small><b id="kFree"></b></div>
      <div class="kpi"><small>Выполнено</small><b id="kDone"></b></div>
    </div>
    <div class="stack" id="stack" role="img" aria-label="Распределение времени по направлениям"></div>
    <div class="plegend" id="plegend"></div>
    <details id="movesBox"><summary id="movesSum"></summary><ul id="movesList"></ul></details>
  </section>

  <div id="weekView" hidden>
    <div class="dayhead">
      <h2>План недели</h2>
      <div class="actions">
        <button class="btn primary" id="addPool">+ В пул</button>
        <button class="btn" id="printPlan">Печать плана</button>
      </div>
    </div>
    <p class="hours">Пул — задачи без даты. Перетащите карточку в нужный день или нажмите «В план». Чтобы вернуть задачу в пул, перетащите её обратно.</p>
    <div class="board" id="board"></div>
  </div>

  <div id="dayView">
  <div class="dayhead">
    <h2 id="dayTitle"></h2>
    <div class="actions">
      <button class="btn primary" id="addBtn">+ Задача</button>
      <button class="btn" id="printDay">Печать дня</button>
      <button class="btn" id="printWeek">Печать недели</button>
    </div>
  </div>
  <p class="hours" id="hours"></p>
  <div id="banners"></div>
  <div id="focus"></div>
  <div class="list" id="list"></div>
  </div>

  <section class="backup" aria-labelledby="bkTitle">
    <h3 id="bkTitle">Резервная копия</h3>
    <p id="bkInfo"></p>
    <div class="actions">
      <button class="btn" id="bkSave">Скачать бэкап</button>
      <label class="btn" for="bkFile">Восстановить из файла</label>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
    <div class="bkconfirm" id="bkConfirm" hidden>
      <div id="bkSummary"></div>
      <div class="actions">
        <button class="btn primary" id="bkMerge">Добавить к текущим</button>
        <button class="btn danger" id="bkReplace">Заменить всё</button>
        <button class="btn" id="bkCancel">Отмена</button>
      </div>
    </div>
  </section>
  <p class="status" id="status">Загружаю задачи…</p>
</main>

<!-- task editor -->
<div id="drawerHost" hidden>
  <div class="scrim" data-close></div>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <form id="form">
      <h3 id="fTitle">Новая задача</h3>
      <label>Задача<input id="fName" required maxlength="200" placeholder="Например: звонок ЖБН по КП"></label>
      <div class="row">
        <label><span id="fDateLbl">День</span><input id="fDate" type="date"></label>
        <label id="fStartBox">Начало<input id="fStart" type="time"></label>
        <label id="fEndBox">Конец<input id="fEnd" type="time"></label>
        <label id="fEstBox" hidden>Сколько займёт<select id="fEst"><option value="30">30 мин</option><option value="60" selected>1 ч</option><option value="90">1,5 ч</option><option value="120">2 ч</option><option value="180">3 ч</option><option value="240">4 ч</option></select></label>
      </div>
      <div class="row2">
        <label>Направление<select id="fProj"></select></label>
        <label>Статус<select id="fStatus"><option value="work">В работе</option><option value="wait">Жду ответа</option></select></label>
      </div>
      <label class="inline"><input type="checkbox" id="fStar"> Главное на день</label>
      <label>Заметка<textarea id="fNote" maxlength="1000" placeholder="Контакты, что подготовить, итог звонка"></textarea></label>
      <div class="formbtns">
        <button type="button" class="btn danger" id="fDelete" hidden>Удалить</button>
        <span style="flex:1"></span>
        <button type="button" class="btn" data-close>Отмена</button>
        <button type="submit" class="btn primary">Сохранить</button>

<script>
const PROJECTS={
  leads:"Обзвон лидов", course:"Курс Ваня", kp:"КП Архивижн", zalkar:"Залкар", jbn:"ЖБН",
  artsky:"Арт Скай", add:"АДД", meder:"Медер / БГА", ads:"Реклама", other:"Прочее"
};
const REASONS=["Не успела","Ждём клиента","Встреча сдвинулась","Срочное вклинилось","Поменялся приоритет"];
const DN=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DFULL=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const $=id=>document.getElementById(id);

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)};
const wd=s=>(parse(s).getDay()+6)%7;
const TODAY=ymd(new Date());
const mins=t=>{if(!/^\d{2}:\d{2}$/.test(t||""))return null;const[h,m]=t.split(":").map(Number);return h*60+m};
const dur=t=>{const a=mins(t.start),b=mins(t.end);return a!=null&&b!=null&&b>a?b-a:0};
const hrs=m=>{const h=m/60;return (Math.round(h*10)/10).toString().replace(".",",")+" ч"};
function fmtShort(d){const x=parse(d);return `${DN[(x.getDay()+6)%7]} ${x.getDate()}.${pad(x.getMonth()+1)}`}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* work windows in minutes; lunch 30 min is not counted as available */
const LUNCH=30;
function windows(d){const w=wd(d);if(w===2)return[[570,900],[1030,1110]];if(w>4)return[];return[[570,1005]]}
function available(d){const ws=windows(d);if(!ws.length)return 0;return ws.reduce((s,[a,b])=>s+b-a,0)-LUNCH}
function hoursFor(d){
  const w=wd(d);
  if(w===2) return "Рабочее время 9:30–15:00 · 15:00–17:00 занято · 17:10–18:30 в офисе, удобно для обзвона";
  if(w>4) return "Выходной";
  return "Рабочее время 9:30–16:45";
}

let tasks=[];   // {id,date,start,end,title,project,note,done,important,waiting,waitSince,waitFor,moves:[{from,to,reason}]}
let week=mondayOf(new Date());
let day=TODAY;
let editing=null;
let store=null;
let mode="local";
let view="day";try{view=localStorage.getItem("planner-view")==="week"?"week":"day"}catch(e){}

/* ---------- storage ---------- */
function localLoad(){try{return JSON.parse(localStorage.getItem("planner-tasks")||"[]")}catch(e){return[]}}
function localSave(){try{localStorage.setItem("planner-tasks",JSON.stringify(tasks))}catch(e){}}
function localStore(){
  return{save:async t=>{const i=tasks.findIndex(x=>x.id===t.id);i<0?tasks.push(t):tasks[i]=t;localSave();render()},
    remove:async id=>{tasks=tasks.filter(x=>x.id!==id);localSave();render()},
    bulk:async(list,replace)=>{if(replace)tasks=list.map(t=>({...t}));else{for(const t of list){const i=tasks.findIndex(x=>x.id===t.id);i<0?tasks.push(t):tasks[i]=t}}localSave();render()}};
}
function setStatus(s){$("status").textContent=s;$("status").hidden=!s}
const SEED=[{"id": "s0", "date": "2026-10-26", "start": "12:40", "end": "13:00", "title": "Планирование недели, список лидов на обзвон", "project": "leads", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s1", "date": "2026-10-26", "start": "13:30", "end": "14:30", "title": "ЖБН: звонок по результатам КП, гибкое предложение", "project": "jbn", "note": "", "done": false, "important": true, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s2", "date": "2026-10-26", "start": "14:30", "end": "15:30", "title": "Обзвон лидов: первое касание", "project": "leads", "note": "Заодно: подтвердить дату и время с Залкар, назначить встречу с Медером", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s3", "date": "2026-10-26", "start": "15:30", "end": "16:30", "title": "КП Архивижн: начать доработку", "project": "kp", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s4", "date": "2026-10-27", "start": "09:45", "end": "12:00", "title": "Обзвон лидов: первые касания и интервью", "project": "leads", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s5", "date": "2026-10-27", "start": "12:00", "end": "13:00", "title": "Презентация Залкар: структура и ключевые тезисы", "project": "zalkar", "note": "Что показываем в шахматке", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s6", "date": "2026-10-27", "start": "13:30", "end": "15:00", "title": "Курс Ваня: модуль, часть 1", "project": "course", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s7", "date": "2026-10-27", "start": "15:00", "end": "16:00", "title": "Арт Скай: анализ дебиторки, стратегия", "project": "artsky", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s8", "date": "2026-10-27", "start": "16:00", "end": "16:30", "title": "КП Архивижн: доработка", "project": "kp", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s9", "date": "2026-10-28", "start": "09:45", "end": "11:30", "title": "Презентация Залкар: слайды и демо", "project": "zalkar", "note": "", "done": false, "important": true, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s10", "date": "2026-10-28", "start": "11:30", "end": "13:00", "title": "АДД: работа с Аяной и командой", "project": "add", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s11", "date": "2026-10-28", "start": "13:30", "end": "15:00", "title": "Реклама: оффер, тексты, креативы, бюджет", "project": "ads", "note": "Лалафо + Instagram, аутсорс сопровождения заявки в БГА, ЦА — физлица", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s12", "date": "2026-10-28", "start": "17:10", "end": "18:30", "title": "Обзвон: интервью и дожим", "project": "leads", "note": "ЖБН, если не ответила в пн; Арт Скай — первый контакт по дебиторке", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s13", "date": "2026-10-29", "start": "09:45", "end": "11:30", "title": "Обзвон лидов", "project": "leads", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s14", "date": "2026-10-29", "start": "11:30", "end": "13:00", "title": "Презентация Залкар: финализация и прогон", "project": "zalkar", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s15", "date": "2026-10-29", "start": "13:30", "end": "15:00", "title": "Курс Ваня: модуль, часть 2 (закрыть модуль)", "project": "course", "note": "", "done": false, "important": true, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s16", "date": "2026-10-29", "start": "15:00", "end": "16:30", "title": "Встреча с Медером в БГА", "project": "meder", "note": "С учётом дороги", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s17", "date": "2026-10-30", "start": "09:30", "end": "10:30", "title": "Финальный прогон презентации Залкар", "project": "zalkar", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s18", "date": "2026-10-30", "start": "10:30", "end": "12:00", "title": "Обзвон лидов / дожим ЖБН", "project": "leads", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s19", "date": "2026-10-30", "start": "13:30", "end": "15:00", "title": "Встреча Залкар (ориентировочно)", "project": "zalkar", "note": "Уточнить точное время", "done": false, "important": true, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s20", "date": "2026-10-30", "start": "15:00", "end": "16:00", "title": "Запуск рекламы в Лалафо и Instagram", "project": "ads", "note": "", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}, {"id": "s21", "date": "2026-10-30", "start": "16:00", "end": "16:45", "title": "Итоги недели и план на следующую", "project": "other", "note": "Статус по лидам, ЖБН, Арт Скай", "done": false, "important": false, "waiting": false, "waitSince": "", "waitFor": "", "moves": []}];
async function initStore(){
  mode="local";
  let seeded=false;try{seeded=localStorage.getItem("planner-seeded")==="1"}catch(e){}
  tasks=localLoad();
  if(!seeded&&!tasks.length){tasks=SEED.map(t=>({...t}));localSave();try{localStorage.setItem("planner-seeded","1")}catch(e){}}
  store=localStore();
  setStatus("Задачи хранятся в этом браузере. На другом устройстве список свой: переносите через бэкап.");
  render();
}

/* ---------- analysis ---------- */
const byTime=(a,b)=>(a.start||"").localeCompare(b.start||"")||(a.title||"").localeCompare(b.title||"");
const tasksOn=d=>tasks.filter(t=>t.date===d).sort(byTime);
const poolTasks=()=>tasks.filter(t=>!t.date).sort((a,b)=>(b.important?1:0)-(a.important?1:0)||(a.title||"").localeCompare(b.title||""));
const est=t=>dur(t)||Number(t.est)||60;
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
/* first free slot of `len` minutes in the day's work windows, skipping lunch 13:00–13:30 */
function nextFree(d,len){
  const busy=tasksOn(d).filter(t=>mins(t.start)!=null).map(t=>[mins(t.start),mins(t.end)??mins(t.start)+30]);
  if(wd(d)<5)busy.push([780,810]);
  busy.sort((a,b)=>a[0]-b[0]);
  for(const[s,e]of windows(d)){
    let c=s;
    for(const[a,b]of busy){if(b<=c)continue;if(a>=e)break;if(a-c>=len)return c;c=Math.max(c,b)}
    if(e-c>=len)return c;
  }
  const last=busy.length?Math.max(...busy.map(x=>x[1])):570;return Math.min(last,1380-len);
}
function scheduled(t,d,start){
  if(!d)return{...t,date:"",est:est(t),start:"",end:""};
  if(!t.date){const len=est(t);const a=start!=null?start:nextFree(d,len);return{...t,date:d,start:hm(a),end:hm(Math.min(a+len,1439))}}
  return moved(t,d,"");
}
function conflicts(d){
  const list=tasksOn(d).filter(t=>!t.done);const out={};
  const add=(id,msg)=>{(out[id]=out[id]||[]).push(msg)};
  const ws=windows(d);
  for(const t of list){
    const a=mins(t.start),b=mins(t.end)??a;
    if(a==null||!ws.length)continue;
    if(!ws.some(([s,e])=>a>=s&&b<=e))add(t.id,"вне рабочего времени");
  }
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const x=list[i],y=list[j];const xa=mins(x.start),xb=mins(x.end),ya=mins(y.start),yb=mins(y.end);
    if(xa==null||ya==null||xb==null||yb==null)continue;
    if(xa<yb&&ya<xb){add(x.id,`пересекается с ${y.start}`);add(y.id,`пересекается с ${x.start}`)}
  }
  return out;
}

/* ---------- render ---------- */
const checkSvg='<svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function renderWeek(){
  const ds=[0,1,2,3,4,5,6].map(i=>ymd(addDays(week,i)));
  const wt=tasks.filter(t=>ds.includes(t.date));
  const avail=ds.reduce((s,d)=>s+available(d),0);
  const per={};let plan=0;
  for(const t of wt){const m=dur(t);plan+=m;per[t.project]=(per[t.project]||0)+m}
  $("kAvail").textContent=hrs(avail);$("kPlan").textContent=hrs(plan);
  const free=avail-plan;$("kFree").textContent=(free<0?"−":"")+hrs(Math.abs(free));$("kFree").className=free<0?"neg":"";
  $("kDone").textContent=`${wt.filter(t=>t.done).length} из ${wt.length}`;
  const keys=Object.keys(PROJECTS).filter(k=>per[k]);
  const base=Math.max(avail,plan)||1;
  $("stack").innerHTML=keys.map(k=>`<i style="--pc:var(--p-${k});width:${per[k]/base*100}%" title="${PROJECTS[k]}: ${hrs(per[k])}"></i>`).join("");
  $("plegend").innerHTML=keys.length?keys.sort((a,b)=>per[b]-per[a]).map(k=>`<span style="--pc:var(--p-${k})">${PROJECTS[k]}<b>${hrs(per[k])}</b></span>`).join(""):"<span style='--pc:var(--line)'>На этой неделе пока нет задач со временем</span>";
  // moves made into or within this week
  const mv=[];for(const t of tasks)for(const m of (t.moves||[]))if(ds.includes(m.from))mv.push({t,m});
  $("movesBox").hidden=!mv.length;
  if(mv.length){
    const cnt={};mv.forEach(({m})=>{const r=m.reason||"Без причины";cnt[r]=(cnt[r]||0)+1});
    $("movesSum").textContent=`Переносы за неделю: ${mv.length} · `+Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`${r} (${n})`).join(", ");
    $("movesList").innerHTML=mv.sort((a,b)=>a.m.from.localeCompare(b.m.from)).map(({t,m})=>`<li>${esc(t.title)}: ${fmtShort(m.from)} → ${fmtShort(m.to)}${m.reason?` · ${esc(m.reason)}`:""}</li>`).join("");
  }
}

function setView(v){view=v;try{localStorage.setItem("planner-view",v)}catch(e){}render();window.scrollTo(0,0)}
function render(){
  document.body.classList.toggle("wide",view==="week");
  $("vDay").setAttribute("aria-pressed",view==="day");$("vWeek").setAttribute("aria-pressed",view==="week");
  $("dayView").hidden=view!=="day";$("weekView").hidden=view!=="week";$("days").hidden=view!=="day";
  const end=addDays(week,6);
  $("weekLabel").textContent=`${week.getDate()} ${MON[week.getMonth()].slice(0,3)} – ${end.getDate()} ${MON[end.getMonth()].slice(0,3)}`;
  const nav=$("days");nav.innerHTML="";
  for(let i=0;i<7;i++){
    const d=ymd(addDays(week,i));const list=tasksOn(d);
    const pct=list.length?Math.round(100*list.filter(t=>t.done).length/list.length):0;
    const hasC=Object.keys(conflicts(d)).length>0;
    const b=document.createElement("button");
    b.className="tab"+(d===day?" active":"")+(d===TODAY?" today":"")+(i>4?" weekend":"");
    b.setAttribute("aria-pressed",d===day);
    b.innerHTML=`<span class="dn">${DN[i]}</span><span class="dd">${addDays(week,i).getDate()}</span><span class="bar"><i style="width:${pct}%"></i></span>${hasC?'<span class="warnDot" title="Есть пересечения"></span>':""}`;
    b.onclick=()=>{day=d;render()};
    nav.appendChild(b);
  }
  renderWeek();
  if(view==="week")renderBoard();

  const dt=parse(day);const w=wd(day);
  $("dayTitle").textContent=`${DFULL[w]}, ${dt.getDate()} ${MON[dt.getMonth()]}`+(day===TODAY?" · сегодня":"");
  const items=tasksOn(day);
  const planned=items.reduce((s,t)=>s+dur(t),0);const av=available(day);
  $("hours").textContent=hoursFor(day)+(av?` · запланировано ${hrs(planned)} из ${hrs(av)}`:"");

  // banners: overdue and waiting (only on today)
  const bn=$("banners");bn.innerHTML="";
  if(day===TODAY){
    const late=tasks.filter(t=>t.date&&t.date<TODAY&&!t.done);
    if(late.length){
      const box=document.createElement("div");box.className="banner over";
      box.innerHTML=`<span>Не закрыто с прошлых дней: <b>${late.length}</b></span>`;
      const mv=document.createElement("button");mv.className="btn";mv.textContent="Перенести на сегодня";
      mv.onclick=async()=>{for(const t of late){await store.save(moved(t,TODAY,"Не закрыто вовремя"))}toast(`Перенесено: ${late.length}`)};
      box.appendChild(mv);bn.appendChild(box);
    }
    const pool=poolTasks().filter(t=>!t.done);
    if(pool.length){
      const box=document.createElement("div");box.className="banner waiting";box.style.cssText="display:flex";
      box.innerHTML=`<span>В пуле без даты: <b>${pool.length}</b> (~${hrs(pool.reduce((s,t)=>s+est(t),0))})</span>`;
      const ob=document.createElement("button");ob.className="btn";ob.textContent="Открыть план недели";ob.onclick=()=>setView("week");
      box.appendChild(ob);bn.appendChild(box);
    }
    const waiting=tasks.filter(t=>t.waiting&&!t.done&&t.date>TODAY).sort((a,b)=>a.date.localeCompare(b.date));
    if(waiting.length){
      const box=document.createElement("div");box.className="banner waiting";
      box.innerHTML=`<span>Ждём ответа: <b>${waiting.length}</b></span><ul>${waiting.map(t=>`<li>${esc(t.title)} <span class="d">· связаться ${fmtShort(t.date)}</span></li>`).join("")}</ul>`;
      bn.appendChild(box);
    }
  }

  // focus: top results of the day
  const stars=items.filter(t=>t.important);
  $("focus").innerHTML=`<div class="focus"><h3>Главное на день</h3>${stars.length?`<ol>${stars.map(t=>`<li class="${t.done?"done":""}">${esc(t.title)}</li>`).join("")}</ol>`:`<p>Отметьте ☆ до трёх задач, которые важнее всего сделать сегодня.</p>`}</div>`;

  const conf=conflicts(day);
  const list=$("list");list.innerHTML="";
  if(!items.length)list.innerHTML=`<div class="empty">На этот день задач нет.<br>Добавьте задачу или перенесите сюда незакрытую.</div>`;
  for(const t of items){
    const el=document.createElement("div");
    el.className="task"+(t.done?" done":"")+(t.important?" star":"")+(conf[t.id]?" conflict":"");
    el.style.setProperty("--pc",`var(--p-${PROJECTS[t.project]?t.project:"other"})`);
    const flags=[];
    if(t.waiting&&!t.done)flags.push(`<span class="flag w">Ждём ответа${t.waitSince?` с ${fmtShort(t.waitSince)}`:""}${t.waitFor?`: ${esc(t.waitFor)}`:""} · напомнить</span>`);
    if(conf[t.id])flags.push(`<span class="flag x">${esc([...new Set(conf[t.id])].join(", "))}</span>`);

function cardHtml(t,conf){

  if(t.moves?.length)fl.push(`<span class="flag m">перенос ×${t.moves.length}</span>`);
  const time=t.date?(t.start?`${esc(t.start)}${t.end?"–"+esc(t.end):""}`:"без времени"):`~${hrs(est(t))}`;
  return `<button class="check" aria-label="${t.done?"Снять отметку":"Отметить выполненной"}">${checkSvg}</button>
    <span class="ct">${time}</span><span></span>
    <button class="cttl">${t.important?'<span class="s">★</span>':""}${esc(t.title)}</button>
    ${fl.length?`<span></span><div class="cflags">${fl.join("")}</div>`:""}

}
function renderBoard(){

      el.addEventListener("dragend",()=>el.classList.remove("dragging"));
      el.querySelector(".check").onclick=()=>store.save({...t,done:!t.done,waiting:t.done?t.waiting:false});
      el.querySelector(".cttl").onclick=()=>openForm(t);

      cards.appendChild(el);
    }
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("dragover")});
    col.addEventListener("dragleave",e=>{if(!col.contains(e.relatedTarget))col.classList.remove("dragover")});
    col.addEventListener("drop",async e=>{
      e.preventDefault();col.classList.remove("dragover");
      const t=tasks.find(x=>x.id===e.dataTransfer.getData("text/plain"));if(!t||t.date===c.d)return;

    });
    b.appendChild(col);
  }
}
function nextWorkday(d){let x=addDays(parse(d),1);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return ymd(x)}
function moved(t,to,reason){
  if(to===t.date)return t;
  // a reschedule counts as a "перенос" only once the task was due, or when a reason is given
  const count=t.date&&(reason||t.date<=TODAY);
  return{...t,date:to,moves:count?[...(t.moves||[]),{from:t.date,to,reason:reason||""}]:(t.moves||[])};
}

let pending=null;
function clean(t){
  const dRe=/^\d{4}-\d{2}-\d{2}$/;
  if(!t||typeof t!=="object"||(t.date&&!dRe.test(t.date))||!String(t.title||"").trim())return null;
  const tm=v=>/^\d{2}:\d{2}$/.test(v||"")?v:"";
  const moves=Array.isArray(t.moves)?t.moves.filter(m=>m&&dRe.test(m.from||"")&&dRe.test(m.to||"")).slice(0,50).map(m=>({from:m.from,to:m.to,reason:String(m.reason||"").slice(0,160)})):[];
  return{est:[30,60,90,120,180,240].includes(Number(t.est))?Number(t.est):60,id:String(t.id||uid()).replace(/[^A-Za-z0-9_\-.~:@+]/g,"").slice(0,60)||uid(),date:t.date||"",start:tm(t.start),end:tm(t.end),
    title:String(t.title).slice(0,200),project:PROJECTS[t.project]?t.project:"other",note:String(t.note||"").slice(0,1000),done:!!t.done,
    important:!!t.important,waiting:!!t.waiting,waitSince:dRe.test(t.waitSince||"")?t.waitSince:"",waitFor:String(t.waitFor||"").slice(0,200),moves};
}
$("bkFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let raw;try{raw=JSON.parse(await f.text())}catch(err){toast("Это не файл бэкапа: не удалось прочитать");return}
  const list=(Array.isArray(raw)?raw:raw?.tasks||[]).map(clean).filter(Boolean);
  if(!list.length){toast("В файле нет задач для восстановления");return}
  pending=list;
  const ds=list.map(t=>t.date).filter(Boolean).sort();if(!ds.length)ds.push(TODAY);
  $("bkSummary").innerHTML=`В файле <b>${list.length}</b> задач с ${fmtShort(ds[0])} по ${fmtShort(ds[ds.length-1])}${raw?.exportedAt?`, бэкап от ${esc(String(raw.exportedAt).slice(0,10).split("-").reverse().join("."))}`:""}.<br>«Добавить» оставит текущие задачи и обновит совпадающие. «Заменить всё» удалит текущие (сейчас их ${tasks.length}).`;
  $("bkReplace").textContent="Заменить всё";$("bkReplace").dataset.armed="";
  $("bkConfirm").hidden=false;
});
$("bkCancel").onclick=()=>{pending=null;$("bkConfirm").hidden=true};
$("bkMerge").onclick=async()=>{
  if(!pending)return;const list=pending;pending=null;$("bkConfirm").hidden=true;
  try{await store.bulk(list,false);toast(`Восстановлено: ${list.length}`)}catch(e){toast("Не удалось восстановить. Попробуйте ещё раз.")}
};
$("bkReplace").onclick=async()=>{
  const b=$("bkReplace");if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Точно заменить?";return}
  if(!pending)return;const list=pending;pending=null;$("bkConfirm").hidden=true;
  try{await store.bulk(list,true);toast(`Заменено: ${list.length} задач`)}catch(e){toast("Не удалось восстановить. Попробуйте ещё раз.")}
};

/* ---------- navigation ---------- */
$("prevW").onclick=()=>{week=addDays(week,-7);day=ymd(week);render()};
$("nextW").onclick=()=>{week=addDays(week,7);day=ymd(week);render()};
$("todayBtn").onclick=()=>{week=mondayOf(new Date());day=TODAY;render()};
$("addBtn").onclick=()=>openForm(null);
$("addPool").onclick=()=>openForm(null,{date:""});
$("vDay").onclick=()=>setView("day");$("vWeek").onclick=()=>setView("week");

render();
initStore();
</script>
</body>
